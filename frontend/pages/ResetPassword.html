<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar senha | FarmLab</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="auth.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth">
<aside class="auth-aside">
  <div class="nav-logo" style="font-size:1.2rem"><i class="fa-solid fa-leaf"></i> Farm<span>Lab</span></div>
  <div>
    <h2>Entenda o que a lavoura está dizendo.</h2>
    <p>Acompanhe NDVI, clima e solo de cada talhão em um só painel.</p>
  </div>
  <p style="font-size:.8rem;color:var(--text-muted)">Análise espaço-temporal e produtividade</p>
</aside>
<main class="auth-main"><div class="auth-box">
  <h1>Recuperar senha</h1>
  <p>Informe seu e-mail e enviaremos um link para criar uma nova senha.</p>
  <form data-form="reset" novalidate>
    <div class="form-msg" role="alert"></div>
    <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" placeholder="nome@fazenda.com"><div class="field-error"></div></div>
    <button class="btn" type="submit">Enviar link</button>
  </form>
  <p class="auth-foot"><a href="login.html">Voltar para entrar</a></p>
</div></main>
<script src="auth.js"></script>
</body>
</html>
